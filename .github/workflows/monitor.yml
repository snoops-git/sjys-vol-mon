name: SJYS Prelude Monitor

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run SJYS monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python monitor.py

      - name: Save monitor state
        run: |
          git config user.name "SJYS Monitor"
          git config user.email "sjys-monitor@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "Update SJYS monitor state"
            git push
          fi
